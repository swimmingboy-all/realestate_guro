name: 구로동 실거래 수집 및 VWorld 자동 지번 복원

on:
  schedule:
    # 매주 월요일 자정(UTC 기준), 한국시간 오전 9시 실행
    - cron: '0 0 * * 1'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 데이터 처리 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: 4. 국토부 실거래가 수집 및 VWorld 지번 복원 (data.json 생성)
        env:
          TZ: 'Asia/Seoul'
          GURO_API_KEY: ${{ secrets.GURO_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          # [매우 중요] VWorld API 발급 시 신청했던 본인의 정확한 도메인을 주입합니다.
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
        run: |
          python guro_land_collector.py --cli --export-json data.json

      - name: 5. 갱신된 data.json 저장소에 자동 커밋 & 배포
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 실거래 최신화 및 VWorld 지번 복원 업데이트" && git push)