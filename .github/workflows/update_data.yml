name: 구로동 토지 실거래 자동 수집 (GURO_API_KEY 연동)

# 1. 자동 실행 주기 및 수동 실행 트리거 설정
on:
  schedule:
    # 매주 월요일 오전 9시 KST 실행 (UTC 기준 일요일 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # GitHub 웹 화면에서 'Run workflow' 버튼으로 언제든 즉시 수동 실행 가능

# 저장소 파일 자동 커밋 및 푸시 권한 부여
permissions:
  contents: write

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 데이터 처리 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: 4. 국토부 실거래가 수집 및 data.json 생성
        env:
          # 사용자가 등록한 GitHub Secret을 환경변수로 안전하게 주입
          GURO_API_KEY: ${{ secrets.GURO_API_KEY }}
        run: |
          python guro_land_collector.py --cli --min-pyung 0 --export-json data.json

      - name: 5. 갱신된 data.json 저장소에 자동 커밋 & 배포
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 구로동 실거래 최신 데이터 자동 동기화 (GURO_API_KEY)" && git push)