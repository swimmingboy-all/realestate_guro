name: 구로동 실거래 수집 (VWorld 주석 처리 모드)

on:
  schedule:
    # 매일 한국 시간(KST) 새벽 6시 실행 (UTC 기준 전날 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 데이터 처리 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: 4. 국토부 실거래가 초고속 수집 (data.json 생성)
        env:
          TZ: 'Asia/Seoul'
          GURO_API_KEY: ${{ secrets.GURO_API_KEY }}
          # -------------------------------------------------------------
          # [VWorld 매칭 일시 중단] 
          # 필요 시 언제든 앞의 '#'을 지워 다시 활성화할 수 있습니다.
          # -------------------------------------------------------------
          # VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          # VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
        run: |
          python guro_land_collector.py --cli --export-json data.json

      - name: 5. 갱신된 data.json 저장소에 자동 커밋 & 배포
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 국토부 실거래 데이터 최신화 (초고속 수집)" && git push)